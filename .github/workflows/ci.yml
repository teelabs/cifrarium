name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run unit and integration tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build and verify Linux release artifacts
        run: |
          bash -n scripts/build-release.sh scripts/install.sh scripts/install-test.sh scripts/verify-release.sh
          scripts/build-release.sh --out-dir "$RUNNER_TEMP/cifrarium-release"
          scripts/verify-release.sh --dir "$RUNNER_TEMP/cifrarium-release"

      - name: Exercise verified Linux installer lifecycle
        run: scripts/install-test.sh

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "$GITHUB_SHA"

      - name: Check version and changelog
        run: ./scripts/verify-version-changelog.sh

      - name: Scan tracked files for high-confidence secrets
        run: ./scripts/verify-secrets.sh

      - name: Verify MCP handshake
        run: go test ./internal/mcp -run TestInitializeHandshake -count=1

      - name: Check systemd installer syntax
        run: bash -n scripts/install-systemd-user.sh

      - name: Test systemd installer without activation
        run: |
          test_home="$(mktemp -d)"
          XDG_CONFIG_HOME="$test_home/config" HOME="$test_home/home" scripts/install-systemd-user.sh
          test -f "$test_home/config/systemd/user/cifrarium.service"
