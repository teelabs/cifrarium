name: Release Linux installer

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches VERSION
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "${TAG_VERSION#v}" = "$(tr -d '[:space:]' < VERSION)"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test and build release artifacts
        run: |
          go test ./...
          scripts/build-release.sh --out-dir "$RUNNER_TEMP/cifrarium-release"
          cp scripts/install.sh "$RUNNER_TEMP/cifrarium-release/install.sh"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign release archives with GitHub OIDC
        run: |
          shopt -s nullglob
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/cifrarium-release/install.sh.bundle" \
            "$RUNNER_TEMP/cifrarium-release/install.sh"
          for archive in "$RUNNER_TEMP/cifrarium-release"/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.bundle" "$archive"
          done

      - name: Verify signed release artifacts
        run: |
          scripts/verify-release.sh \
            --dir "$RUNNER_TEMP/cifrarium-release" \
            --require-signatures

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            "$RUNNER_TEMP/cifrarium-release"/*
