name: Release Linux installer

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, and publish release artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches VERSION
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          test "${TAG_VERSION#v}" = "$(tr -d '[:space:]' < VERSION)"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test and build release artifacts
        run: |
          go test ./...
          scripts/build-release.sh --out-dir "$RUNNER_TEMP/cifrarium-release"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release archives with GitHub OIDC
        run: |
          shopt -s nullglob
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/cifrarium-release/install.sh.bundle" \
            "$RUNNER_TEMP/cifrarium-release/install.sh"
          for archive in "$RUNNER_TEMP/cifrarium-release"/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.bundle" "$archive"
          done

      - name: Verify signed release artifacts
        run: |
          scripts/verify-release.sh \
            --dir "$RUNNER_TEMP/cifrarium-release" \
            --require-signatures

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            "$RUNNER_TEMP/cifrarium-release"/*
